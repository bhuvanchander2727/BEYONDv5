.beam{left:-10%;right:-10%;top:-4%;height:74%;--d:-10;background:radial-gradient(38% 62% at calc(50% + var(--tx,0)*10%) 0%,rgba(255,250,240,.42),rgba(255,250,240,.08) 55%,transparent 75%)}
.mark{left:-6%;top:12%;height:52%;width:20%;--d:-14;--z:-120px;display:flex;align-items:center;justify-content:center;opacity:.55}
.mark svg{width:100%;height:100%;overflow:visible}
.mark text{fill:none;stroke:var(--paper);stroke-width:1;font-family:Syne,'Arial Black',sans-serif;font-weight:800}
.floor{left:-10%;right:-10%;top:66%;bottom:-10%;--d:-2;background:linear-gradient(rgba(8,8,7,.55),rgba(8,8,7,.92));border-top:1px solid rgba(255,255,255,.14)}
.rack{left:0;right:0;top:12%;height:54%;--d:12;--z:60px}
.item{position:absolute;left:50%;bottom:0;height:100%;margin-left:calc(var(--iw)/-2);width:var(--iw);will-change:transform,opacity;transform-origin:50% 100%}
.item i{position:absolute;inset:0;display:block;background:var(--img) center bottom/contain no-repeat}
.item .rf{top:100%;transform:scaleY(-1);margin-top:18px;opacity:.28;filter:blur(1.2px);-webkit-mask:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.9));mask:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.9))}
.item .gl{-webkit-mask:var(--img) center bottom/contain no-repeat;mask:var(--img) center bottom/contain no-repeat;background:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:260% 100%;background-position:calc(50% + var(--tx,0)*50%) 0;mix-blend-mode:soft-light}
.item .pad{position:absolute;left:12%;right:12%;bottom:-26px;height:22px;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);filter:blur(4px)}
.top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px 0}
.logo{font-family:Syne,'Arial Black',sans-serif;font-weight:800;font-size:22px;letter-spacing:.32em;margin-right:-.32em}
.top button{background:none;border:0;color:var(--paper);padding:6px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.info{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:46px 22px 16px;background:linear-gradient(transparent,rgba(12,12,11,.88) 42%)}
.bars{display:flex;gap:6px;margin-bottom:16px}
.bars button{flex:1;height:3px;border:0;padding:0;background:var(--paper);opacity:.22;position:relative;cursor:pointer;transition:opacity .3s}
.bars button::after{content:"";position:absolute;inset:-12px 0}
.bars button.on{opacity:1}
.name{font-family:Syne,'Arial Black',sans-serif;font-weight:800;font-size:clamp(22px,6.6vw,28px);line-height:1.05;letter-spacing:.04em;text-transform:uppercase;min-height:2.1em;transition:opacity .25s,transform .25s}
.name.f{opacity:0;transform:translateY(8px)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.price{font-weight:700;font-size:20px;letter-spacing:.04em}
.price small{display:block;font-size:12px;color:var(--mute);letter-spacing:.14em;margin-bottom:3px}
.view{background:var(--paper);color:var(--night);text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.14em;padding:18px 30px}
.enable{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:7;background:var(--paper);color:var(--night);border:0;padding:9px 12px;font:700 10px 'Space Mono',monospace;letter-spacing:.14em;display:none}
.tabs{position:absolute;bottom:0;left:0;right:0;background:var(--night);border-top:1px solid #2c2c29;display:flex;justify-content:space-around;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 12px 'Space Mono',monospace;letter-spacing:.06em;color:#7d7a73;text-decoration:none;position:relative;text-transform:uppercase}
.tab.on{color:var(--paper)}.tab.on::before{content:"";position:absolute;top:-13px;left:-8px;right:-8px;height:3px;background:var(--paper)}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7}
@media (prefers-reduced-motion:reduce){.stage,.name{transition:none}}
@media (max-height:660px){.rack{top:10%;height:52%}}

<script>
(function(){
var P=[["Distressed moto jacket","₹42,000"],["Heavy fleece hoodie 01","₹8,500"],["Racing spider oversized tee","₹6,500"],["Raw plaster hoodie 02","₹8,500"]],N=P.length;
var hero=document.getElementById('hero'),st=document.getElementById('stage'),rack=document.getElementById('rack'),btn=document.getElementById('enable');
var items=[].slice.call(document.querySelectorAll('.item')),bars=document.getElementById('bars'),nameEl=document.getElementById('name');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,pos=0,target=0,shown=-1,timer,drag=null,iw=0;
P.forEach(function(p,k){var b=document.createElement('button');b.setAttribute('aria-label','Piece '+(k+1));b.onclick=function(){goTo(k);play()};bars.appendChild(b)});
var bs=[].slice.call(bars.children);
function size(){iw=rack.clientWidth*.74;rack.style.setProperty('--iw',iw+'px');items.forEach(function(e){e.style.setProperty('--iw',iw+'px')})}
function wrap(v){return ((v%N)+N+N/2)%N-N/2}
function render(){
 items.forEach(function(el,i){var d=wrap(i-pos),a=Math.abs(d);
  var x=d*iw*.8,z=-a*230,ry=-d*46;
  el.style.transform='translate3d('+x+'px,0,'+z+'px) rotateY('+ry+'deg)';
  el.style.opacity=Math.max(0,Math.min(1,1.9-a*1.1));
  el.style.filter='brightness('+(1-.6*Math.min(a,1))+')';
  el.style.zIndex=20-Math.round(a*4);el.style.pointerEvents=a<1.4?'auto':'none'});
 var s=((Math.round(pos)%N)+N)%N;
 if(s!==shown){shown=s;nameEl.classList.add('f');bs.forEach(function(b,k){b.classList.toggle('on',k===s)});
  setTimeout(function(){nameEl.textContent=P[s][0];document.getElementById('price').textContent=P[s][1];document.getElementById('cnt').textContent='0'+(s+1)+' / 0'+N;nameEl.classList.remove('f')},140)}}
function loop(){var diff=target-pos;if(Math.abs(diff)>.0008){pos+=diff*(drag?.35:.11);render()}requestAnimationFrame(loop)}
function goTo(k){var cur=Math.round(target),d=wrap(k-cur);target=cur+d}
function play(){clearInterval(timer);if(!reduce)timer=setInterval(function(){target=Math.round(target)+1},5500)}
items.forEach(function(el,i){el.addEventListener('click',function(){if(Math.abs(wrap(i-pos))>.3){goTo(i);play()}})});
hero.addEventListener('pointerdown',function(e){drag={x:e.clientX,t:target,m:false};clearInterval(timer)});
addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x;if(Math.abs(dx)>6)drag.m=true;target=drag.t-dx/(iw*.8)});
addEventListener('pointerup',function(){if(!drag)return;target=Math.round(target);drag=null;play()});
size();addEventListener('resize',size);render();loop();play();
function set(x,y){x=Math.max(-1,Math.min(1,x));y=Math.max(-1,Math.min(1,y));
 st.style.setProperty('--ry',(x*8)+'deg');st.style.setProperty('--rx',(-y*6)+'deg');st.style.setProperty('--tx',x);st.style.setProperty('--ty',y)}
if(reduce)return;
hero.addEventListener('pointermove',function(e){if(e.pointerType==='touch'||drag)return;var r=hero.getBoundingClientRect();set((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1)});
hero.addEventListener('pointerleave',function(){set(0,0)});
var base=null;function onO(e){if(e.gamma==null)return;if(!base)base={b:e.beta,g:e.gamma};set((e.gamma-base.g)/24,(e.beta-base.b)/24)}
var D=window.DeviceOrientationEvent;
if(D&&typeof D.requestPermission==='function'){btn.style.display='block';btn.onclick=function(){D.requestPermission().then(function(s){if(s==='granted')addEventListener('deviceorientation',onO);btn.remove()}).catch(function(){btn.remove()})}}
else if(D){addEventListener('deviceorientation',onO)}
})();
